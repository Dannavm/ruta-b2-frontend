<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi ruta al B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F5; --surface:#FFFFFF; --ink:#13203A; --muted:#55637B; --line:#D2DAE4;
  --a2:#0E8577; --b1:#B97E00; --b2:#2D57C9; --ex:#BE2F4A;
  --ok:#0E8577; --bad:#BE2F4A; --hl:#FFF2C7;
  --font:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1423; --surface:#151F34; --ink:#E5EBF4; --muted:#9AA7BE; --line:#27344E;
    --a2:#3CC4B2; --b1:#F0B53A; --b2:#82A0FF; --ex:#FF7590; --ok:#3CC4B2; --bad:#FF7590; --hl:#3A3214;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1423; --surface:#151F34; --ink:#E5EBF4; --muted:#9AA7BE; --line:#27344E;
  --a2:#3CC4B2; --b1:#F0B53A; --b2:#82A0FF; --ex:#FF7590; --ok:#3CC4B2; --bad:#FF7590; --hl:#3A3214;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--b2);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* Header */
.top{padding:28px 0 8px}
.top h1{font-stretch:125%;font-weight:850;font-size:clamp(2rem,6vw,3.4rem);line-height:1;letter-spacing:-.02em;margin:0}
.top .sub{color:var(--muted);margin:.5rem 0 0;max-width:60ch}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;padding:14px 12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;font-stretch:90%}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding:24px 0 64px}
.view{display:none}
.view.on{display:block}
h2{font-stretch:118%;font-weight:800;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.1;margin:0 0 .4rem;letter-spacing:-.01em}
h3{font-stretch:105%;font-weight:750;font-size:1.15rem;margin:0 0 .4rem}
.lede{color:var(--muted);margin:0 0 1.4rem;max-width:66ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Route line (hero) */
.route{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;margin-bottom:22px}
.route-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-end;margin-bottom:22px}
.route-head .where{font-stretch:112%;font-weight:800;font-size:clamp(1.25rem,3vw,1.7rem);line-height:1.15;max-width:34ch}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font-stretch:125%;font-weight:900;font-size:clamp(2.2rem,6vw,3rem);line-height:1;color:var(--ex)}
.count span{color:var(--muted);font-size:.9rem;max-width:12ch;line-height:1.2}
.line{display:flex;align-items:center;gap:0;position:relative;padding:18px 0 8px}
.seg{position:relative;display:flex;align-items:center;justify-content:space-between;height:10px;border-radius:6px;margin-right:3px}
.seg .dot{width:6px;height:6px;border-radius:50%;background:var(--surface);opacity:.85;flex:none}
.seg .dot.done{opacity:0}
.seg .dot.here{width:20px;height:20px;background:var(--surface);border:5px solid currentColor;opacity:1;box-shadow:0 0 0 4px color-mix(in srgb, currentColor 25%, transparent)}
.seg .dot.test{outline:2px solid var(--surface);background:transparent}
.endstop{flex:none;width:22px;height:22px;border-radius:50%;border:5px solid var(--ex);background:var(--surface);margin-left:2px}
.legend{display:flex;gap:0;margin-top:8px}
.legend div{font-stretch:75%;font-weight:650;font-size:.82rem;line-height:1.2;padding-right:6px;overflow:hidden}
.legend small{display:block;font-weight:400;color:var(--muted)}
.seg .dot.here{position:relative}
@media (max-width:560px){.seg .dot{width:3px;height:3px}.seg .dot.here{width:16px;height:16px;border-width:4px}.legend small{display:none}.endstop{width:18px;height:18px;border-width:4px}}
.here-tag{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:700;white-space:nowrap;background:var(--ink);color:var(--surface);padding:1px 7px;border-radius:9px}

/* Layout helpers */
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel + .panel{margin-top:18px}
.chip{display:inline-block;font-size:.78rem;font-weight:650;padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent);color:var(--c,var(--muted));margin:0 6px 6px 0}
.goals{margin:.6rem 0 0;padding-left:1.2rem}
.goals li{margin:.3rem 0}
.focus{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:.95rem}
.focus dt{color:var(--muted)}
.focus dd{margin:0;font-weight:600}

/* Checklist */
.tasks{list-style:none;margin:10px 0 0;padding:0}
.tasks li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.tasks input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.tasks label{flex:1;cursor:pointer}
.tasks .min{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tasks a{font-size:.85rem;color:var(--b2)}
.done-text{text-decoration:line-through;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface);text-decoration:none;min-height:44px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;min-height:36px;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-stretch:120%;font-weight:850;font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.88rem}

/* Plan */
.phase{margin:0 0 30px}
.phase-head{border-left:6px solid var(--c);padding:4px 0 4px 14px;margin-bottom:12px}
.phase-head h3{font-stretch:118%;font-size:1.35rem;margin:0}
.week{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.week .num{font-stretch:75%;font-weight:800;font-size:1.6rem;line-height:1;color:var(--c)}
.week .num small{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:4px;font-stretch:90%}
.week.current{background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:10px;padding:14px 12px;margin:0 -12px}
.week.past .num{opacity:.55}
.week h4{margin:0 0 4px;font-size:1.05rem;font-stretch:105%}
.week .meta{font-size:.9rem;color:var(--muted)}
.week ul{margin:.4rem 0 0;padding-left:1.1rem;font-size:.94rem}

/* Practice */
.qcard{max-width:720px}
.progressbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 18px}
.progressbar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.q{font-size:1.2rem;font-weight:600;margin:.4rem 0 1rem;line-height:1.45}
.passage{background:color-mix(in srgb,var(--b2) 7%,transparent);border-left:4px solid var(--b2);padding:12px 16px;border-radius:0 10px 10px 0;margin:0 0 14px;font-size:1rem;line-height:1.65;max-width:68ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.opt:disabled{cursor:default}
.answer{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.05rem}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.fb strong{color:var(--c)}
.fb p{margin:.3rem 0 0}
.miss{background:var(--hl);border-radius:4px;padding:0 3px;font-weight:700}
.result{font-stretch:125%;font-weight:900;font-size:3.2rem;line-height:1}

/* Heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:6px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 45%,var(--line))}
.heat i.l2{background:var(--ok)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat i.today{outline:2px solid var(--ink)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.field input,.field select{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);min-height:42px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:650;color:var(--muted)}
.tablewrap{overflow-x:auto}

/* Resources */
.days{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem}
.day.today{border:2px solid var(--ink)}
.day b{display:block;font-stretch:110%;margin-bottom:6px}
.day ul{margin:0;padding-left:1rem}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.res a.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.res a.card:hover{border-color:var(--ink)}
.res a.card b{display:block;font-stretch:108%}
.res a.card span{font-size:.9rem;color:var(--muted)}
.seg-ctrl{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
.seg-ctrl button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg-ctrl button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:58vh;overflow-y:auto;padding:4px 2px 10px}
.bubble{max-width:84%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5}
.bubble.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .say{margin-top:6px;border:0;background:transparent;color:var(--b2);cursor:pointer;font-size:.85rem;font-weight:650;padding:0}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{flex:1;min-height:52px;max-height:160px;resize:vertical;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.mic.on{background:var(--ex);color:#fff;border-color:var(--ex)}
.promptbox{width:100%;min-height:110px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:.9rem}

.status{font-size:.82rem;color:var(--muted);padding:20px 0 0}
.toast{white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>Mi ruta al B2</h1>
  <p class="sub">Danna, de A2 a un certificado B2 para tu maestría Erasmus Mundus. Treinta minutos al día, cada día cuenta.</p>
</div></header>

<nav class="tabs" aria-label="Secciones"><div class="wrap">
  <a href="#hoy">Hoy</a>
  <a href="#plan">Plan semanal</a>
  <a href="#practica">Práctica</a>
  <a href="#conversar">Conversación</a>
  <a href="#progreso">Progreso</a>
  <a href="#recursos">Recursos</a>
</div></nav>

<main class="wrap">
  <section class="view" id="v-hoy"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-practica"></section>
  <section class="view" id="v-conversar"></section>
  <section class="view" id="v-progreso"></section>
  <section class="view" id="v-recursos"></section>
  <p class="status" id="status">Cargando tu progreso…</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  B1: {n:2, name:"B1 independiente", c:"var(--b1)", from:13, to:25, desc:"Contar historias, dar opiniones y entender audios cotidianos sin traducir todo mentalmente.", target:"Meta al cerrar: EF SET 45–50 (B1)."},

function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ============ Estado y almacenamiento ============ */
const LS_KEY = "ruta-b2-danna-v1";
const defaultState = () => ({v:1, days:{}, practices:[], efset:[], settings:{examDate:"2027-08-28", examType:"ielts"}});
let state = defaultState();
const store = {ref:null, mode:"local", dirty:false, saving:false, timer:null};
function mergeState(raw){ const d = defaultState(); if (!raw || typeof raw !== "object") return d;
  return {v:1, days: raw.days && typeof raw.days === "object" ? raw.days : {}, practices: Array.isArray(raw.practices) ? raw.practices : [], efset: Array.isArray(raw.efset) ? raw.efset : [], settings: {...d.settings, ...(raw.settings||{})}}; }
function hasData(s){ return Object.keys(s.days).length || s.practices.length || s.efset.length; }
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (!store.ref) return;
  store.dirty = true;
  clearTimeout(store.timer);
  store.timer = setTimeout(flush, 700);
}
async function flush(){
  if (!store.ref) return;
  if (store.saving){ store.timer = setTimeout(flush, 400); return; }
  store.saving = true;
  try { await store.ref.set(JSON.parse(JSON.stringify(state))); store.dirty = false; setStatus("Progreso guardado en tu cuenta. Lo verás igual en cualquier dispositivo."); }
  catch(e){ setStatus("No se pudo guardar en tu cuenta; tu progreso queda guardado en este navegador."); }
  finally { store.saving = false; }
}
function setStatus(t){ $("#status").textContent = t; }
async function initStorage(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) state = mergeState(JSON.parse(raw)); } catch(e){}
  renderAll();
  setStatus("Tu progreso se guarda en este navegador.");
  const [db, user] = await Promise.all([useCap("db"), useCap("user")]);
  if (!db || !user) return;
  const id = await user.id();
  if (!id) return;
  try { store.ref = db.doc("data/users/"+id+"/progress"); } catch(e){ store.ref = null; return; }
  let first = true;
  const loadTimer = setTimeout(()=>setStatus("No se pudo conectar con tu cuenta todavía. Sigues guardando en este navegador."), 10000);
  store.ref.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(loadTimer);
    if (snap.exists){
      if (!store.dirty){ state = mergeState(JSON.parse(JSON.stringify(snap.data()))); try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(e){} renderAll(true); }
      setStatus("Progreso sincronizado con tu cuenta.");
    } else if (first && !snap.metadata.fromCache){
      if (hasData(state)) save(); // sube lo que había en este navegador
      setStatus("Progreso sincronizado con tu cuenta.");
    }
    if (!snap.metadata.fromCache) first = false;
  }, err => { clearTimeout(loadTimer); store.ref = null; setStatus("Tu progreso se guarda en este navegador."); });
}
function dayRec(key){ if (!state.days[key]) state.days[key] = {}; return state.days[key]; }
function isActive(key){ const d = state.days[key]; if (!d) return 0; const t = d.tasks ? Object.values(d.tasks).filter(Boolean).length : 0; return d.practiced ? 2 : (t>0 ? 1 : 0); }
function streak(){
  let s = 0, d = today0();
  if (!isActive(ymd(d))) d = addDays(d,-1);
  while (true){
    const k = ymd(d);
    if (isActive(k)) s++;
    else if (dowIdx(d) < 5) break; // los fines de semana no rompen la racha
    d = addDays(d,-1);
    if (daysBetween(d, START) > 7) break;
  }
  return s;
}
function bestStreak(){
  const keys = Object.keys(state.days).filter(isActive).sort(); if (!keys.length) return 0;
  let best = 0, cur = 0, d = parseYmd(keys[0]); const end = today0();
  while (d <= end){ if (isActive(ymd(d))) { cur++; best = Math.max(best,cur); } else if (dowIdx(d) < 5) cur = 0; d = addDays(d,1); }
  return best;
}

let session = null; let tts = null; let sample = null;
function phaseForPractice(){ const wn = Math.max(1, Math.min(currentWeek(), WEEKS.length)); return levelOfPhase(weekInfo(wn).ph); }
function buildSet(seedStr, lvl){
  const r = rng(hash(seedStr)); const b = BANK[lvl]; const items = [];
  const mcq = (q, opts, exp, tag) => { const idx = shuffle([0,1,2,3].slice(0,opts.length), r); return {t:"mcq", tag, q, o:idx.map(i=>opts[i]), a:idx.indexOf(0), e:exp}; };
  const vv = shuffle(b.vocab, r); vv.slice(0,4).forEach(v => items.push(mcq(v[0], v[1], v[2], "Vocabulario")));
  shuffle(b.gram, r).slice(0, 3).forEach(g => {
    if (g[0]==="type") items.push({t:"type", tag:"Gramática", q:g[1], a:g[2], e:g[3]});
    else items.push(mcq(g[1], g[2], g[3], "Gramática"));
  });
  const rd = shuffle(b.read, r)[0];
  rd.qs.slice(0,2).forEach(q => { const it = mcq(q[0], q[1], q[2], "Lectura"); it.p = rd.p; it.title = rd.title; items.push(it); });
  if (tts) items.push({t:"listen", tag:"Escucha", s: shuffle(b.listen, r)[0]});
  else { const v = vv[4]; items.push(mcq(v[0], v[1], v[2], "Vocabulario")); }
  return items;
}

  const ra = $("#read-aloud"); if (ra) ra.onclick = () => speak(it.p, 1);
  if (it.t==="mcq") el.querySelectorAll(".opt").forEach(b => b.onclick = () => answerMcq(+b.dataset.i));
  if (it.t!=="mcq"){

    $("#check").onclick = () => it.t==="type" ? answerType(inp.value) : answerListen(inp.value);

function feedback(ok, html){
  session.answered = true; if (ok) session.score++;
  const last = session.i === session.items.length-1;
  $("#fb").innerHTML = `<div class="fb" style="--c:${ok?"var(--ok)":"var(--bad)"}"><strong>${ok?["¡Correcto!","¡Muy bien!","¡Eso es!","¡Perfecto!"][session.i%4]:"Casi. Mira la explicación:"}</strong>${html}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="next">${last?"Ver resultado":"Siguiente"}</button></div>`;
  const nx = $("#next"); nx.focus(); nx.onclick = nextQ;
}
function answerMcq(i){
  if (session.answered) return; const it = session.items[session.i];
  document.querySelectorAll(".opt").forEach((b,j) => { b.disabled = true; if (j===it.a) b.classList.add("right"); else if (j===i) b.classList.add("wrong"); });
  feedback(i===it.a, `<p>${esc(it.e)}</p>`);
}
function answerType(v){
  if (session.answered || !v.trim()) return; const it = session.items[session.i];
  const ok = it.a.some(a => norm(a)===norm(v)); $("#ans").disabled = true;
  feedback(ok, `<p>${ok?"":`Respuesta correcta: <b>${esc(it.a[0].replace(/'/g,"’"))}</b>. `}${esc(it.e)}</p>`);
}
function answerListen(v){
  if (session.answered || !v.trim()) return; const it = session.items[session.i];
  const target = norm(it.s).split(" "); const got = norm(v).split(" ");
  let j = 0; const marks = target.map(w => { const k = got.indexOf(w, j); if (k>=0){ j = k+1; return {w, ok:true}; } return {w, ok:false}; });
  const okCount = marks.filter(m=>m.ok).length; const ok = okCount===target.length && got.length===target.length;
  $("#ans").disabled = true;
  feedback(ok, `<p>La oración era: <i>${esc(it.s)}</i></p>${ok?"":`<p>Palabras que faltaron o cambiaron: ${marks.map(m=>m.ok?esc(m.w):`<span class="miss">${esc(m.w)}</span>`).join(" ")}</p><p class="small muted">Acertaste ${okCount} de ${target.length} palabras. Escúchala de nuevo leyendo el texto.</p>`}`);
}
function nextQ(){
  session.i++; session.answered = false;
  if (session.i >= session.items.length){
    session.done = true; const key = ymd(today0());
    state.practices.push({d:key, k:session.kind, s:session.score, n:session.items.length, l:session.lvl});
    if (state.practices.length > 600) state.practices = state.practices.slice(-600);

}

function lineChart(points, opts){
  // points: [{x:label, y:number}] ; y en 0..100
  const W = 640, H = 220, L = 34, B = 26, T = 12, Rr = 10;
  if (!points.length) return `<p class="muted">${opts.empty}</p>`;
  const lo = opts.min ?? 0, hi = opts.max ?? 100; const n = points.length; const xs = i => L + (n===1 ? (W-L-Rr)/2 : i*(W-L-Rr)/(n-1)); const ys = v => T + (hi - Math.max(lo, Math.min(hi, v)))/(hi-lo)*(H-T-B);
  const lab = (x,y,txt,anchor,col,bold) => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" style="fill:${col}${bold?";font-weight:700":""}">${txt}</text>`;
  let g = "";
  (opts.bands||[]).forEach(b => { g += `<rect x="${L}" y="${ys(b.to)}" width="${W-L-Rr}" height="${ys(b.from)-ys(b.to)}" style="fill:${b.c};opacity:.13"/>` + lab(W-Rr-4, ys(b.to)+13, b.l, "end", b.c, true); });
  if (opts.bands) [30,40,50,60,70].forEach(v => g += lab(L-6, ys(v)+4, v, "end", "var(--muted)"));
  else [0,25,50,75,100].forEach(v => { g += `<line x1="${L}" x2="${W-Rr}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--line)"/>` + lab(L-6, ys(v)+4, v, "end", "var(--muted)"); });
  if (opts.target!=null) g += `<line x1="${L}" x2="${W-Rr}" y1="${ys(opts.target)}" y2="${ys(opts.target)}" style="stroke:var(--ex);stroke-dasharray:5 4;stroke-width:1.5"/>`;
  const path = points.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(p.y).toFixed(1)}`).join(" ");
  g += `<path d="${path}" style="fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round"/>`;
  points.forEach((p,i) => { g += `<circle cx="${xs(i)}" cy="${ys(p.y)}" r="4" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"><title>${esc(p.x)}: ${p.y}</title></circle>`; });
  const step = Math.ceil(n/8);
  points.forEach((p,i) => { if (i%step===0 || i===n-1) g += lab(xs(i), H-6, esc(p.x), "middle", "var(--muted)"); });
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;height:auto" role="img" aria-label="${esc(opts.label)}">${g}</svg></div>`;
}
RENDER.progreso = function(){
  const t = today0(); const startHeat = START < t ? START : addDays(t, -dowIdx(t));
  const activeDays = Object.keys(state.days).filter(isActive).length;
  const last10 = state.practices.slice(-10); const avg = last10.length ? Math.round(last10.reduce((a,p)=>a+p.s/p.n,0)/last10.length*100) : null;
  // heatmap
  let heat = ""; let d = new Date(startHeat); const endHeat = addDays(START, 41*7-1);
  for (let i=0; i<dowIdx(d); i++) heat += `<i class="fut" style="visibility:hidden"></i>`;
  while (d <= endHeat){ const k = ymd(d); const a = isActive(k); const fut = d > t;
    heat += `<i class="${fut?"fut":a===2?"l2":a===1?"l1":""} ${k===ymd(t)?"today":""}" title="${fmt(d)}${a?": estudiaste":""}"></i>`; d = addDays(d,1); }
  const pts = state.practices.slice(-30).map(p => ({x: fmt(parseYmd(p.d)), y: Math.round(p.s/p.n*100)}));
  const ef = state.efset.slice().sort((a,b)=>a.d.localeCompare(b.d));
  const efPts = ef.map(e => ({x: fmt(parseYmd(e.d)), y: e.s}));
  const efWeeks = WEEKS.map((w,i)=>[w,i]).filter(([w])=>w[6]==="efset").map(([w,i]) => `Semana ${i+1} (${fmt(addDays(START,i*7))})`);
  const s = state.settings;
  $("#v-progreso").innerHTML = `<h2>Tu progreso</h2><p class="lede">Un día cuenta como estudiado cuando haces la práctica diaria o marcas al menos una tarea de tu rutina.</p>
    <div class="stats">
      <div class="stat"><b>${activeDays}</b><span>días estudiados</span></div>
      <div class="stat"><b>${streak()}</b><span>días de racha actual</span></div>
      <div class="stat"><b>${bestStreak()}</b><span>mejor racha</span></div>
      <div class="stat"><b>${avg==null?"–":avg+"%"}</b><span>promedio de tus últimas 10 prácticas</span></div>
    </div>
    <div class="panel"><h3>Calendario de estudio</h3><p class="muted small" style="margin-top:0">Cada columna es una semana, de lunes a domingo. Verde intenso: hiciste la práctica. Verde claro: solo tareas.</p><div class="heat">${heat}</div></div>
    <div class="panel"><h3>Puntajes de tus prácticas</h3>${lineChart(pts,{label:"Porcentaje de aciertos en tus últimas prácticas", empty:"Aún no hay prácticas. Haz la de hoy y aparecerá aquí.", target:80})}
      <p class="muted small">Línea punteada: 80%, la meta para sentir dominado un tema.</p>
      ${state.practices.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Nivel</th><th>Puntaje</th></tr></thead><tbody>${state.practices.slice(-8).reverse().map(p=>`<tr><td>${fmt(parseYmd(p.d))}</td><td>${p.k==="daily"?"Diaria":p.k==="claude"?"Con Claude":"Extra"}</td><td>${esc(p.l||"")}</td><td>${p.s}/${p.n}</td></tr>`).join("")}</tbody></table></div>`:""}</div>
    <div class="panel"><h3>Resultados del EF SET</h3><p class="small" style="margin-top:0">Fechas sugeridas: ${efWeeks.join(", ")}. Haz el test de 50 minutos en <a href="https://www.efset.org" target="_blank" rel="noopener">efset.org</a> y registra tu puntaje (0–100).</p>
      ${lineChart(efPts,{label:"Evolución de tu puntaje EF SET", empty:"Registra tu primer EF SET para ver tu evolución.", bands:[{from:31,to:40,c:"var(--a2)",l:"A2"},{from:41,to:50,c:"var(--b1)",l:"B1"},{from:51,to:60,c:"var(--b2)",l:"B2"},{from:61,to:70,c:"var(--ex)",l:"C1"}], target:51, min:20, max:80})}
      <div class="row" style="margin-top:12px;align-items:flex-end">
        <label class="field">Fecha<input type="date" id="ef-d" value="${ymd(t)}"></label>
        <label class="field">Puntaje (0–100)<input type="number" id="ef-s" min="0" max="100" inputmode="numeric" style="width:120px"></label>
        <button class="btn" id="ef-add">Guardar resultado</button>
      </div><p class="small" id="ef-msg" style="color:var(--bad);margin:.4rem 0 0"></p>
      ${ef.length?`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Fecha</th><th>Puntaje</th><th>Nivel</th><th></th></tr></thead><tbody>${ef.map(e=>`<tr><td>${fmtL(parseYmd(e.d))}</td><td>${e.s}</td><td><b>${efLevel(e.s)}</b></td><td><button class="btn ghost small" data-del="${esc(e.d)}|${e.s}">Borrar</button></td></tr>`).join("")}</tbody></table></div>`:""}
    </div>
    <div class="panel"><h3>Tu examen oficial</h3><p class="small" style="margin-top:0">Cambia la fecha cuando la reserves. El contador de la portada se actualiza solo.</p>
      <div class="row" style="align-items:flex-end">
        <label class="field">Fecha del examen<input type="date" id="ex-d" value="${esc(s.examDate)}" min="${ymd(t)}"></label>
        <label class="field">Examen<select id="ex-t"><option value="ielts" ${s.examType==="ielts"?"selected":""}>IELTS Academic</option><option value="det" ${s.examType==="det"?"selected":""}>Duolingo English Test</option><option value="nd" ${s.examType==="nd"?"selected":""}>Aún no lo decido</option></select></label>
        <button class="btn" id="ex-save">Guardar</button>
      </div></div>`;
  $("#ef-add").onclick = () => { const dv = $("#ef-d").value, sv = Number($("#ef-s").value);
    if (!dv || !Number.isFinite(sv) || sv<0 || sv>100 || $("#ef-s").value===""){ $("#ef-msg").textContent = "Escribe una fecha y un puntaje entre 0 y 100."; return; }
    state.efset.push({d:dv, s:Math.round(sv)}); save(); RENDER.progreso(); toast(`Guardado: ${Math.round(sv)} puntos, nivel ${efLevel(sv)}`); };
  $("#v-progreso").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const [dd, ss] = b.dataset.del.split("|"); const i = state.efset.findIndex(e => e.d===dd && String(e.s)===ss); if (i>=0 && confirm("¿Borrar este resultado?")){ state.efset.splice(i,1); save(); RENDER.progreso(); } });
  $("#ex-save").onclick = () => { const dv = $("#ex-d").value; if (!dv) return; state.settings.examDate = dv; state.settings.examType = $("#ex-t").value; save(); toast("Fecha del examen guardada"); };
};

/* ============ Recursos ============ */
let resPhase = null;
RENDER.recursos = function(){
  const wn = Math.max(1, Math.min(currentWeek(), WEEKS.length)); const cur = weekInfo(wn).ph; const ph = resPhase || cur; const p = PHASES[ph];
  const td = dowIdx(today0());
  const days = ROUTINE[ph].map((tasks,i) => `<div class="day ${ph===cur && i===td?"today":""}"><b>${DOW[i]}</b><ul>${tasks.map(t=>`<li>${esc(t[0])} <span class="muted">(${t[2]} min)</span></li>`).join("")}</ul></div>`).join("");
  const cards = PHASE_RES[ph].map(k => { const r = R[k]; const ext = !r.u.startsWith("#");
    return `<a class="card" href="${r.u}" ${ext?'target="_blank" rel="noopener"':""}><b>${esc(r.n)}</b><span>${esc(r.d)}</span></a>`; }).join("");
  $("#v-recursos").innerHTML = `<h2>Recursos gratuitos</h2><p class="lede">Qué usar cada día según tu fase. Todo es gratuito; solo el examen oficial tiene costo.</p>
    <div class="seg-ctrl" role="group" aria-label="Elegir fase">${["A2","B1","B2","EX"].map(k=>`<button data-ph="${k}" aria-pressed="${k===ph}">Fase ${PHASES[k].n}${k===cur?" (actual)":""}</button>`).join("")}</div>
    <h3 style="color:${p.c}">Semana tipo de la fase ${p.n}: ${esc(p.name)}</h3>
    <p class="muted small" style="margin-top:0">Entre semana, 30–45 minutos después del trabajo. Fines de semana, un bloque más largo.</p>
    <div class="days">${days}</div>
    <h3 style="margin-top:26px">Recursos de esta fase</h3><div class="res">${cards}</div>`;
  $("#v-recursos").querySelectorAll("[data-ph]").forEach(b => b.onclick = () => { resPhase = b.dataset.ph; RENDER.recursos(); });
};

/* ============ Inicio ============ */
showView();
initStorage();
(async () => {
  const [t, s, d] = await Promise.all([useCap("tts"), useCap("sample"), useCap("dictation")]);
  tts = t; sample = s; dict = d;
  if (dict){
    dict.onFinal(({text}) => { const m = $("#msg"); if (m){ m.value = (m.value ? m.value : text.trimStart()) + (m.value ? text : ""); } });
    dict.onState(({state:st}) => { const mic = $("#mic"); if (mic) mic.classList.toggle("on", st!=="idle"); });
  }
  const v = currentView();
  if (!(v==="practica" && session)) render(v);
})();
</script>
